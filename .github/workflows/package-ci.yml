name: Package CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sessions:
    runs-on: ubuntu-latest
    outputs:
      build-sessions: ${{ steps.matrix.outputs.build-sessions }}
      lint-sessions: ${{ steps.matrix.outputs.lint-sessions }}
      test-sessions: ${{ steps.matrix.outputs.test-sessions }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --only-group nox --locked
      - id: matrix
        run: |
          for session in build lint test; do
            echo "${session}-sessions=$(uv run nox -t $session -l --json | jq -c '[.[].session]')" >> $GITHUB_OUTPUT
          done
  build:
    name: ${{ matrix.session }}
    needs:
      - sessions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.sessions.outputs.build-sessions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --only-group nox --locked
      - run: uv run nox -s "${{ matrix.session }}"
  lint:
    name: ${{ matrix.session }}
    needs:
      - sessions
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.sessions.outputs.lint-sessions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --only-group nox --locked
      - run: uv run nox -s "${{ matrix.session }}"
  test:
    name: ${{ matrix.session }}
    needs:
      - sessions
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.sessions.outputs.test-sessions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --only-group nox --locked
      - run: uv run nox -s "${{ matrix.session }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage_${{ matrix.session }}
          path: coverage.xml
  codecov:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
